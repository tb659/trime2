# Rime schema
# encoding: utf-8

schema:
  schema_id: pinyin_simp
  name: 拼音简体
  version: "0.8"
  author:
    - 佚名
  description: |
    源自 Android 拼音
  dependencies:
    - stroke

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: pinyin #拼音滤镜
    reset: 0
    states: [拼, pīn]
  - name: ascii_punct
    reset: 0
    states: [。，, ．，]
  - name: show_raw_input_candidate
    reset: 0
    states: [a1隐, a1显]
  - name: prediction
    reset: 1
    states: [联想隐, 联想显]
  - name: emoji_cn #emoji滤镜
    reset: 0
    states: [🈚, 🈶]
  - name: simplification #简转繁滤镜
    reset: 0
    states: [简中, 繁中]
  - name: full_shape
    reset: 0
    states: [半角, 全角]
  - name: charset_comment_filter #字符集提示
    reset: 0
    states: [U区关, U区开]
  - name: udpf_switch
    reset: 0
    states: [U编关, U编开]

engine:
  processors: # 组件处理按键消息
    - ascii_composer # 处理西文模式及中西文切
    - recognizer # 与matcher搭配，处理符合特定规则的输入码，如网址、反查等tags
    - key_binder # 在特定条件下将按键绑定到其他按键，如重定义逗号、句号为候选翻页、切换快捷键等
    - speller # 删除内存，接受字符按键，编辑输入
    - punctuator # 句读处理器，将单个字符快捷键直接映射为标点符号或文字
    - selector # 选字处理器，处理数字选字键〔可以换成其他哦〕、上、下定位候选、换页
    - navigator # 处理输入栏内部的移动
    - express_editor # 编辑器，处理空格、回车上屏、回退键
  segmentors: # 组件识别不同的内容类型，将输入码分段并加上tag
    - ascii_segmentor # 标识西文段落〔比喻如在西文模式下〕字母直接上屛
    - matcher # 表达recognizer标志符合特定规则的段落，如网址、反查等，加上特定tag
    - affix_segmentor@easy_english # 用户自定义tag 单击可加载多个实例，后接@+tag名称
    - abc_segmentor # 符号惯用的文字段落，加上abc这个tag
    - punct_segmentor # 符号句读句子〔键入标点符号用〕加上punct这个tag
    - fallback_segmentor # 其他标识未标识文字
  translators: # 组件翻译特定类型的编码段为一组候选文字
    - punct_translator
    - reverse_lookup_translator # 反查翻译器，用另一种编码方案查码
    - script_translator # 脚本翻译器，用于【仓颉】、【五笔】等基于脚本的输入方案 该可加载多个实例，后接@+翻译器名〔如：pinyin、jyutping等〕
    - table_translator@easy_english # 临时英文
    - history_translator@history # 历史翻译器
    - lua_translator@number_translator # 数字转大写
    - lua_translator@calculator_translator # 简易计算器
    - lua_translator@shijian_translator # 高级时间
  filters: # 组件过滤转换的结果，皆系过滤器可使用开关调节
    - simplifier@simplification #简繁滤镜
    # - simplifier@fanjian  #繁简滤镜
    - simplifier@pinyin #拼音滤镜
    - simplifier@chaifen #拆分滤镜
    - simplifier@emoji_cn #表情滤镜
    - lua_filter@charset_comment_filter # Unicode分区提示滤镜
    - lua_filter@lua_unicode_display_filter # Unicode编码显示
    - uniquifier # 过滤的重复候选字，有可能来自simplifier
    - reverse_lookup_filter@reverse_lookup # 反查词典滤镜

speller:
  alphabet: "['zyxwvutsrqponmlkjihgfedcba]" # 输入范围 码元
  delimiter: " '"
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/

translator:
  dictionary: pinyin_simp # 字典文件
  initial_quality: 1    #该翻译器出字优先级别
  enable_user_dict: true # 开启用户词典〔用户词典记录动态字词频、用户词〕
  enable_encoder: true # 开启自动造词
  strict_spelling: false
  enable_sentence: true # 是否开启自动造句
  enable_completion: false # 编码提示 true 开启  false 关闭
  encode_commit_history: true # 是否对已上屏的词自动造词
  max_phrase_length: 99  #自动造词的最长字数
  preedit_format: # 上屏码自定义
    # 说明
    # xform   --改写〔不保留原形〕
    # derive  --衍生〔保留原形〕
    # abbrev  --简拼〔出字优先级较上两组更低〕
    # fuzz    --略拼〔此种简拼仅组词，不出单字〕
    # xlit    --变换〔适合大量一对一变换〕
    # erase   --刪除
    - xform/([nl])v/$1ü/ # 拼音状态下输入nv实际显示nü
    - xform/([nl])ue/$1üe/ # n或者l后面紧跟着输入ue显示üe
    - xform/([jqxy])v/$1u/ # j q x y 后面紧跟着输入v 实际显示u

# 识别器
recognizer:
  import_preset: default
  patterns:
    # hack: to enable "/fh" style symbols, '/' must be mapped to a [list].
    # so those who have customized '/' for direct commit won't be affected by
    # this change.
    punct: "^/([0-9]+[a-z]*|[a-z]+)$"
    reverse_lookup: "`[a-z]*'?$"

# 键绑定器
key_binder:
  import_preset: default

# 标点符号
punctuator:
  import_preset: symbols # 由外部统一文件导入

# translators/history_translator 临时历史
history:
  input: z # 触发此翻译器的字串
  size: 1 # 设置候选记录量，默认: 0 继续(commit_record最大存储量 20）
  initial_quality: 999 # 权重

# segmentors/affix_segmentor 临时英文
easy_english:
  dictionary: easy_english
  tag: easy_english
  prefix: "'"
  tips: 〔En〕
  enable_completion: true
  enable_sentence: false
  initial_quality: -1
  preedit_format:
    # 说明
    # xform   --改写〔不保留原形〕
    # derive  --衍生〔保留原形〕
    # abbrev  --简拼〔出字优先级较上两组更低〕
    # fuzz    --略拼〔此种简拼仅组词，不出单字〕
    # xlit    --变换〔适合大量一对一变换〕
    # erase   --刪除
    - "xlit|_| |"
  comment_format: #去掉编码提示前的~号
    - "xform/~/ /"

# filters/simplifier 简繁(+部分异体)滤镜
simplification:  #⇩四选一
  opencc_config: st_tu.json        # 简 ➡ 繁（秃版CC标准）
  # opencc_config: s2tw.json    # 简 ➡ 台湾正体
  # opencc_config: s2hk.json    # 简 ➡ 香港繁体
  # opencc_config: s2twp.json  # 简 ➡ 台湾正体（含常用词汇如：软体→軟體、鼠标→滑鼠）
  option_name: simplification
  tips: all  # # 转换文字段 all字词|char字

# filters/simplifier 繁简滤镜
# fanjian:
#   opencc_config: t2s.json   # 繁 ➡ 简（OpenCC标准）
#   option_name: fanjian

# filters/simplifier 拼音滤镜
pinyin:
  opencc_config: pinyin.json
  option_name: pinyin
  show_in_comment: true #作为注解在后面显示
  comment_format:
    - 'xform/&nbsp;/ /'
    - "xform/^/ /"
  tips: char
  tags:
    - abc
    - reverse_lookup

# filters/simplifier emoji 表情滤镜
emoji_cn:
  opencc_config: emoji.json
  option_name: emoji_cn
  tips: all

# 笔画反查
reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔笔画〕
  preedit_format:
    # 说明
    # xform   --改写〔不保留原形〕
    # derive  --衍生〔保留原形〕
    # abbrev  --简拼〔出字优先级较上两组更低〕
    # fuzz    --略拼〔此种简拼仅组词，不出单字〕
    # xlit    --变换〔适合大量一对一变换〕
    # erase   --刪除
    - xlit/hspnz/一丨丿丶ㄥ/
  comment_format:
    # - xform/([nl])v/$1ü/
    - "xform/^.+$//"

