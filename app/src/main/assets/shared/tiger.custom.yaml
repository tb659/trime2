#下面的 #号 是注释符，注释了就无效了，删掉即可生效
patch:

  style/inline_preedit: false # 嵌入编码模式，默认是true开启，若想关闭，取消注释即可（删除前面的#号）
  style/preedit_type: input # 嵌入首选项内容(字词)。有4个选项可设：input 嵌入输入码 | composition 嵌入编码 | preview 嵌入首选项 | preview_all 嵌入全部内容
  style/horizontal: true # 默认是false竖排显示，删掉行首的#号，可横排显示（横排建议把上面这行注释掉）
  style/vertical_auto_reverse: false # 竖排候选框超长时，自动倒序 默认启用，若想关闭，将该行行首的#删掉
